<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lumen — Bible Trivia</title>
  <meta name="description" content="Lumen is a beautiful Bible trivia game with 240 questions across 20 categories, a 12-level campaign, daily challenges, and local or online multiplayer.">
  <meta name="theme-color" content="#070b14">
  <meta name="color-scheme" content="dark light">
  <meta property="og:title" content="Lumen — Bible Trivia">
  <meta property="og:description" content="Twenty categories. Twelve levels. Two thousand years of story. Play solo, pass-and-play, or online.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/img/hero-window.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/cormorant.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="ambient" aria-hidden="true">
    <div class="ambient-glow one"></div>
    <div class="ambient-glow two"></div>
    <div class="starfield"></div>
    <div class="grain"></div>
  </div>

  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <button class="brand" data-nav="home" aria-label="Lumen home">
        <span class="brand-mark" aria-hidden="true">
          <img src="assets/img/logo.svg" alt="">
        </span>
        <span class="brand-word">LUMEN<small>Bible Trivia</small></span>
      </button>

      <nav class="desktop-nav" aria-label="Primary">
        <button class="nav-link" data-nav="home">Play</button>
        <button class="nav-link" data-nav="campaign">Campaign</button>
        <button class="nav-link" data-nav="multiplayer">Multiplayer</button>
        <button class="nav-link" data-nav="library">Library</button>
        <button class="nav-link" data-nav="profile">Profile</button>
      </nav>

      <div class="top-actions">
        <button class="streak-chip" id="header-streak" data-nav="daily" title="Daily challenge streak" aria-label="Open daily challenge">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1.7 4.2-1.9 5.6-1.9 9A2.9 2.9 0 0 0 13 13.9c1.8-.2 2.6-1.7 2.5-3.4 2 2 3.5 4.2 3.5 6.9a7 7 0 1 1-14 0c0-4.9 4.1-7.9 7-15.4Z"/></svg>
          <span id="header-streak-count">0</span>
        </button>
        <button class="icon-btn" id="sound-toggle" aria-label="Toggle sound" title="Toggle sound">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m16 9 5 6m0-6-5 6"/></svg>
        </button>
        <button class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V10a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
        </button>
        <button class="avatar-btn" id="profile-btn" data-nav="profile" aria-label="Open profile">
          <span id="avatar-initial">S</span>
          <span class="avatar-level" id="avatar-level">1</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Mobile navigation">
    <button data-nav="home" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg><span>Play</span></button>
    <button data-nav="campaign"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V5a2 2 0 0 1 2-2h9l5 5v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 3v6h6"/></svg><span>Journey</span></button>
    <button data-nav="multiplayer"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3 3 0 0 1 0 5.5M18 20a6 6 0 0 0-3-5.2"/></svg><span>Rivals</span></button>
    <button data-nav="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4Z"/><path d="M20 4h-4a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h4Z"/></svg><span>Library</span></button>
    <button data-nav="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg><span>Profile</span></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <noscript>
    <div class="noscript">Lumen needs JavaScript enabled to play. Please enable JavaScript and reload.</div>
  </noscript>

  <script src="vendor/peerjs.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
