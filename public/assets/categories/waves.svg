<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="waves artwork">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4aa8"/>
      <stop offset=".52" stop-color="#131a3c"/>
      <stop offset="1" stop-color="#070a17"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".4" r=".5">
