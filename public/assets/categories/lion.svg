  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b65a1e"/>
      <stop offset=".52" stop-color="#131a3c"/>
      <stop offset="1" stop-color="#070a17"/>
