<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e20">
  <meta name="description" content="Scripture Showdown — a beautiful Bible trivia arena with solo journeys, daily challenges, pass-and-play, bots, and live online rooms.">
  <meta property="og:title" content="Scripture Showdown — Bible Trivia Arena">
  <meta property="og:description" content="Test your knowledge. Treasure His Word. 226 questions, 15 categories, four levels, and live rooms.">
  <meta property="og:type" content="website">
  <title>Scripture Showdown — Bible Trivia Arena</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient__orb ambient__orb--one"></div>
    <div class="ambient__orb ambient__orb--two"></div>
    <div class="ambient__orb ambient__orb--three"></div>
    <div class="ambient__stars"></div>
    <div class="ambient__noise"></div>
  </div>
  <div id="app" class="app-shell" role="main"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <noscript>
    <div style="padding:48px;text-align:center;font-family:Georgia,serif">
      <h1>Scripture Showdown</h1>
      <p>This game needs JavaScript enabled. The Word is worth it.</p>
    </div>
  </noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
